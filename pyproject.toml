[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylock-bridge"
version = "0.1.0"
description = "Inspect, plan, and validate Python dependency intent across pyproject.toml and pylock targets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "OpenAI", email = "support@openai.com"}
]
keywords = ["packaging", "pyproject", "pylock", "dependency-groups", "monorepo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration"
]

[project.urls]
Homepage = "https://example.com/pylock-bridge"
Repository = "https://example.com/pylock-bridge"

[project.scripts]
pylock-bridge = "pylock_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
